name: Unit Tests
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "**.py"
      - ".github/workflows/tests.yaml"
# Exported to every step, so these win over core_backend/tests/test.env (which the
# test package loads with setdefault). The conftest recreates POSTGRES_DB from a
# migrated template on every run, and gives the alembic tests their own empty DB.
env:
  POSTGRES_PASSWORD: postgres-test-pw
  POSTGRES_USER: postgres-test-user
  POSTGRES_DB: postgres-test-db
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis://redis:6379
  PROMETHEUS_MULTIPROC_DIR: /tmp
jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    container: node:20-bookworm
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.0-alpine
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y lsb-release && apt-get clean all
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Python libraries
        run: |
          python -m pip install -r core_backend/requirements.txt
          python -m pip install -r requirements-dev.txt
      # One run covers everything except the real-LLM `rails` tests (excluded by
      # the default addopts): feature tests, alembic migration tests and BDD.
      - name: Run tests with coverage (fails under 80%)
        run: |
          cd core_backend
          python -m pytest --cov --cov-report=term-missing
