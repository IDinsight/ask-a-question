# One pipeline for the whole system (core_backend + admin_app).
#
#   Phase 1  checks  : SAST, type check, dependency audit   (both apps, in parallel)
#   Phase 2  tests   : backend pytest, frontend vitest + playwright
#   Phase 3  deploy  : core_backend, then admin_app
#
# Each phase `needs` every job of the phase before it, so a failure anywhere
# (e.g. a backend audit) stops the frontend too. Nothing is deployed unless
# every check and test for both apps passed.
#
# Deploy targets:
#   push to main                  -> testing
#   push to testing / production  -> that environment
#   release published             -> production
#   workflow_dispatch             -> the chosen input ("none" = checks + tests only)
#   pull_request                  -> never deploys
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, testing, production]
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy to (none = run checks and tests only)"
        required: true
        default: none
        type: choice
        options: [none, testing, production]

# One run per ref. Superseded PR runs are cancelled; deploy runs are never
# cancelled mid-way, they queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Phase 1: checks
  # ===========================================================================

  backend-sast:
    name: "Phase 1 / backend: SAST (Bandit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core_backend/uv.lock
      # --only-dev installs the dev group (incl. bandit pinned in uv.lock) without
      # the heavy runtime deps. Exclusions + skipped checks live in [tool.bandit].
      - run: uv run --locked --only-dev bandit -c pyproject.toml -r . -q

  frontend-sast:
    name: "Phase 1 / frontend: SAST (Semgrep)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # src/client is generated by @hey-api/openapi-ts, so it is not scanned.
      # --error makes any finding fail the job.
      - run: >-
          uvx semgrep==1.185.0 scan
          --config p/typescript --config p/react --config p/nextjs --config p/secrets
          --exclude src/client
          --metrics off --error
          src scripts

  backend-typecheck:
    name: "Phase 1 / backend: type check + lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core_backend/uv.lock
      # mypy needs the runtime deps to resolve imports, so this is a full sync.
      - run: uv sync --locked
      - run: uv run mypy .
      - run: uv run ruff check .
      - run: uv run black --check .

  frontend-typecheck:
    name: "Phase 1 / frontend: type check + lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
        with:
          package_json_file: admin_app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: admin_app/.nvmrc
          cache: pnpm
          cache-dependency-path: admin_app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  backend-audit:
    name: "Phase 1 / backend: dependency audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Audit exactly what ships: the locked runtime deps, no dev group.
      # Nothing is installed; pip-audit resolves versions against the OSV/PyPI DBs.
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit==2.9.0 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off

  frontend-audit:
    name: "Phase 1 / frontend: dependency audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin_app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: admin_app/.nvmrc
      # Reads pnpm-lock.yaml only. Production deps; fails on high or critical.
      - run: pnpm audit --prod --audit-level high

  # ===========================================================================
  # Phase 2: tests (only if every Phase 1 job passed)
  # ===========================================================================

  backend-tests:
    name: "Phase 2 / backend: tests"
    needs: [backend-sast, frontend-sast, backend-typecheck, frontend-typecheck, backend-audit, frontend-audit]
    runs-on: ubuntu-22.04
    # Runs in a container so the service containers resolve by hostname.
    container: node:20-bookworm
    # Exported to every step, so these win over core_backend/tests/test.env
    # (loaded with setdefault). The conftest rebuilds POSTGRES_DB from a migrated
    # template each run and gives the alembic tests their own empty DB.
    env:
      POSTGRES_PASSWORD: postgres-test-pw
      POSTGRES_USER: postgres-test-user
      POSTGRES_DB: postgres-test-db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis://redis:6379
      PROMETHEUS_MULTIPROC_DIR: /tmp
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres-test-pw
          POSTGRES_USER: postgres-test-user
          POSTGRES_DB: postgres-test-db
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:6.0-alpine
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: core_backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core_backend/uv.lock
      - run: uv sync --locked
      # Feature tests, alembic migration tests (incl. single-head check) and BDD.
      # Real-LLM `rails` tests are excluded by the default addopts.
      - name: pytest (fails under 80% coverage)
        run: uv run pytest --cov --cov-report=term-missing

  frontend-tests:
    name: "Phase 2 / frontend: tests"
    needs: [backend-sast, frontend-sast, backend-typecheck, frontend-typecheck, backend-audit, frontend-audit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin_app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: admin_app/.nvmrc
          cache: pnpm
          cache-dependency-path: admin_app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # Playwright starts `next dev` itself (playwright.config.ts webServer) and
      # mocks the backend (tests/integration/helpers/mockApi.ts).
      - name: Integration tests (playwright)
        run: pnpm test:integration
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin_app/playwright-report
          retention-days: 7

  # ===========================================================================
  # Phase 3: deploy (only if every Phase 2 job passed, and only for deploy events)
  # ===========================================================================

  resolve-env:
    name: "Phase 3 / resolve target environment"
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
    steps:
      - id: env
        # Empty env_name means "do not deploy".
        run: |
          case "${{ github.event_name }}" in
            release)           env_name=production ;;
            workflow_dispatch) env_name="${{ inputs.environment }}"
                               [ "$env_name" = "none" ] && env_name="" ;;
            push)
              case "${{ github.ref_name }}" in
                main)               env_name=testing ;;
                testing|production) env_name="${{ github.ref_name }}" ;;
                *)                  env_name="" ;;
              esac ;;
            *)                 env_name="" ;;
          esac
          echo "Deploy target: ${env_name:-none}"
          echo "env_name=$env_name" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: "Phase 3 / deploy core_backend"
    needs: [resolve-env]
    if: needs.resolve-env.outputs.env_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    environment: gcp-${{ needs.resolve-env.outputs.env_name }}
    env:
      RESOURCE_PREFIX: ${{ secrets.PROJECT_NAME }}-${{ needs.resolve-env.outputs.env_name }}
      REPO: ${{ secrets.DOCKER_REGISTRY_DOMAIN }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_NAME }}-${{ needs.resolve-env.outputs.env_name }}
      # Production images are tagged with the release tag, everything else with the SHA.
      TAG: ${{ (needs.resolve-env.outputs.env_name == 'production' && github.ref_name) || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.POOL_ID }}/providers/${{ vars.PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            domain:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-domain
            jwt-secret:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-jwt-secret
            google-login-client-id:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-google-login-client-id
            langfuse-secret-key:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-langfuse-secret-key
            langfuse-public-key:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-langfuse-public-key
            db-host:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-db-host
            db-password:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-db-password
            admin-username:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-admin-username
            admin-password:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-admin-password
            admin-api-key:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-admin-api-key
            gcp-credential-json:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-gcp-credential-json
            mistral-api-key:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-mistral-api-key

      - name: Copy GCP credentials JSON to the VM
        working-directory: deployment/docker-compose
        run: |
          echo '${{ steps.secrets.outputs.gcp-credential-json }}' > .gcp_credentials.json
          gcloud compute scp .gcp_credentials.json \
            ${{ secrets.DEPLOYMENT_INSTANCE_NAME }}:~/.gcp_credentials.json \
            --zone ${{ secrets.DEPLOYMENT_ZONE }}

      - name: Build and push image
        working-directory: core_backend
        run: |
          gcloud auth configure-docker ${{ secrets.DOCKER_REGISTRY_DOMAIN }}
          docker build -t $REPO/core_backend:latest -t $REPO/core_backend:$TAG .
          docker image push --all-tags $REPO/core_backend

      - name: Run container on the VM
        id: ssh
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: ${{ secrets.DEPLOYMENT_INSTANCE_NAME }}
          zone: ${{ secrets.DEPLOYMENT_ZONE }}
          ssh_private_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command: |
            docker-credential-gcr configure-docker --registries ${{ secrets.DOCKER_REGISTRY_DOMAIN }}
            docker pull ${{ env.REPO }}/core_backend:latest
            docker stop core_backend || true
            docker rm core_backend || true
            docker run -d \
              --log-driver=gcplogs \
              --restart always \
              --network aaq-network \
              --name core_backend \
              -v ~/.gcp_credentials.json:/app/credentials.json \
              -v temp:/usr/src/aaq_backend/temp \
              -e JWT_SECRET="${{ steps.secrets.outputs.jwt-secret }}" \
              -e NEXT_PUBLIC_GOOGLE_LOGIN_CLIENT_ID="${{ steps.secrets.outputs.google-login-client-id }}" \
              -e DOMAIN="${{ steps.secrets.outputs.domain }}" \
              -e POSTGRES_HOST="${{ steps.secrets.outputs.db-host }}" \
              -e POSTGRES_PASSWORD="${{ steps.secrets.outputs.db-password }}" \
              -e ADMIN_USERNAME="${{ steps.secrets.outputs.admin-username }}" \
              -e ADMIN_PASSWORD="${{ steps.secrets.outputs.admin-password }}" \
              -e ADMIN_API_KEY="${{ steps.secrets.outputs.admin-api-key }}" \
              -e PROMETHEUS_MULTIPROC_DIR=/tmp \
              -e LITELLM_ENDPOINT=http://litellm_proxy:4000 \
              -e GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json \
              -e URGENCY_CLASSIFIER="llm_entailment_classifier" \
              -e REDIS_HOST=redis://redis:6379 \
              -e LANGFUSE=True \
              -e LANGFUSE_SECRET_KEY="${{ steps.secrets.outputs.langfuse-secret-key }}" \
              -e LANGFUSE_PUBLIC_KEY="${{ steps.secrets.outputs.langfuse-public-key }}" \
              -e MISTRAL_API_KEY="${{ steps.secrets.outputs.mistral-api-key }}" \
              -e BACKEND_ROOT_PATH=/api \
              ${{ env.REPO }}/core_backend:latest
            docker system prune -f || true

      - name: Show deployment output
        run: |
          echo '${{ steps.ssh.outputs.stdout }}'
          echo '${{ steps.ssh.outputs.stderr }}'

      # Poll for up to ~3 min instead of a fixed sleep. Failing here stops the
      # admin_app deploy.
      - name: Health check
        run: |
          for i in $(seq 1 18); do
            curl -fsS "https://${{ steps.secrets.outputs.domain }}/api/healthcheck" && exit 0
            sleep 10
          done
          echo "core_backend did not become healthy" && exit 1

  deploy-frontend:
    name: "Phase 3 / deploy admin_app"
    # Only after the backend deployed AND passed its health check.
    needs: [resolve-env, deploy-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: gcp-${{ needs.resolve-env.outputs.env_name }}
    env:
      RESOURCE_PREFIX: ${{ secrets.PROJECT_NAME }}-${{ needs.resolve-env.outputs.env_name }}
      REPO: ${{ secrets.DOCKER_REGISTRY_DOMAIN }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_NAME }}-${{ needs.resolve-env.outputs.env_name }}
      TAG: ${{ (needs.resolve-env.outputs.env_name == 'production' && github.ref_name) || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.POOL_ID }}/providers/${{ vars.PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          min_mask_length: 4
          secrets: |-
            domain:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-domain
            google-login-client-id:${{ secrets.GCP_PROJECT_ID }}/${{ env.RESOURCE_PREFIX }}-google-login-client-id

      - name: Build and push image
        working-directory: admin_app
        run: |
          gcloud auth configure-docker ${{ secrets.DOCKER_REGISTRY_DOMAIN }}
          docker build -t $REPO/admin_app:latest -t $REPO/admin_app:$TAG .
          docker image push --all-tags $REPO/admin_app

      # The browser only talks to the admin_app's BFF (/bff/*); the BFF reaches
      # core_backend over the docker network via BACKEND_INTERNAL_URL (same as
      # deployment/docker-compose/docker-compose.yml).
      - name: Run container on the VM
        id: ssh
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: ${{ secrets.DEPLOYMENT_INSTANCE_NAME }}
          zone: ${{ secrets.DEPLOYMENT_ZONE }}
          ssh_private_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command: |
            docker-credential-gcr configure-docker --registries ${{ secrets.DOCKER_REGISTRY_DOMAIN }}
            docker pull ${{ env.REPO }}/admin_app:latest
            docker stop admin_app || true
            docker rm admin_app || true
            docker run -d \
              --log-driver=gcplogs \
              --restart always \
              --network aaq-network \
              --name admin_app \
              -e BACKEND_INTERNAL_URL=http://core_backend:8000 \
              -e NEXT_PUBLIC_GOOGLE_LOGIN_CLIENT_ID="${{ steps.secrets.outputs.google-login-client-id }}" \
              ${{ env.REPO }}/admin_app:latest
            docker system prune -f || true

      - name: Show deployment output
        run: |
          echo '${{ steps.ssh.outputs.stdout }}'
          echo '${{ steps.ssh.outputs.stderr }}'

      - name: Health check
        run: |
          for i in $(seq 1 18); do
            curl -fsS -o /dev/null "https://${{ steps.secrets.outputs.domain }}/login" && exit 0
            sleep 10
          done
          echo "admin_app did not become healthy" && exit 1
