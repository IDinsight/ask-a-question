name: Deploy Docs
on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: docs/.cache
          restore-keys: |
            mkdocs-material-

      # Docs are a standalone uv project in docs/ (see docs/pyproject.toml)
      - name: Install dependencies
        working-directory: docs
        run: uv sync --locked

      - name: Build and push docs version
        working-directory: docs
        run: |
          git config user.name github-actions-runner
          git config user.email aaq@idinsight.org
          git fetch origin gh-pages
          uv run mike deploy \
            --push \
            --title="${{ github.ref_name }}" \
            --update-aliases ${{ github.ref_name }} latest
          uv run mike set-default latest --allow-undefined --push

      - name: Add CNAME
        run: |
          git switch gh-pages
          echo "docs.ask-a-question.com" >> CNAME
          git add CNAME
          git commit -m "Add CNAME"
          git push -f origin gh-pages
