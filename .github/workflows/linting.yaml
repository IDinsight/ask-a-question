name: Python Linting
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "**.py"

jobs:
  python-lint-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Lint tools and their config live in core_backend/pyproject.toml (dev group)
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core_backend/uv.lock

      - name: Install dependencies
        working-directory: core_backend
        run: uv sync --locked

      # Whole project; settings (explicit_package_bases, overrides) in pyproject.toml.
      - name: Run MyPy
        working-directory: core_backend
        run: uv run mypy .

      # SAST. Config (exclusions, skipped checks and why) in [tool.bandit].
      - name: Run Bandit
        working-directory: core_backend
        run: uv run bandit -c pyproject.toml -r . -q

      - name: Run ruff
        working-directory: core_backend
        run: uv run ruff check .

      - name: Check code formatting with Black
        working-directory: core_backend
        run: uv run black --check .
