[project]
name = "core-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Matches the Docker images (python:3.12-slim-bookworm). Pinned deps like
# numpy 1.26.4 and torch 2.4.1 have no wheels for 3.13+.
requires-python = ">=3.12,<3.13"
# Exact pins mirrored from requirements.txt
dependencies = [
    "gunicorn==23.0.0",
    "uvicorn[standard]==0.54.0",
    "uvicorn-worker==0.4.0",
    "fastapi[standard]==0.162.2",
    "alembic==1.12.0",
    "pgvector==0.2.5",
    "psycopg2==2.9.9",
    "asyncpg==0.30.0",
    "litellm==1.61.15",
    "sqlalchemy[asyncio]==2.0.20",
    "PyPDF2==3.0.1",
    "python-multipart==0.0.33",
    "pyjwt[crypto]==2.8.0",
    "prometheus_client==0.19.0",
    "google-api-python-client==2.129.0",
    "google-api-python-client-stubs==1.25.0",
    "langfuse==2.42.1",
    "pandas==2.2.2",
    "pandas-stubs==2.2.2.240603",
    "types-openpyxl==3.1.4.20240621",
    "numpy==1.26.4",
    "scipy==1.14.1",
    "torch==2.4.1",
    "redis==5.0.8",
    "python-dateutil==2.8.2",
    "bertopic==0.16.3",
    "google-cloud-storage==2.18.2",
    "google-cloud-texttospeech==2.16.5",
    "google-cloud-speech==2.27.0",
    "pydub==0.25.1",
    "sentence-transformers==3.0.1",
    "transformers==4.53.3",
    "scikit-learn==1.5.1",
    "bokeh==3.5.1",
    "faster-whisper==1.0.3",
    "sentry-sdk[fastapi]==2.74.0",
    "dotmap==1.3.30",
    "termcolor==2.5.0",
    "langchain==0.3.26",
    "langchain-community==0.3.27",
    "langchain-core==0.3.66",
    "langchain-text-splitters==0.3.8",
    "mistralai==1.6.0",
    "python-dotenv==1.2.4",
    "slowapi>=0.1.10",
]

# Test tooling. uv installs the `dev` group by default on `uv sync` / `uv run`,
# so `uv run pytest` always has the plugins. Docker images install from
# requirements.txt and do not include these. Keep in sync with ../requirements-dev.txt.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-alembic==0.13.2",
    "pytest-asyncio==1.4.1.post1",
    "pytest-bdd==9.0.1",
    "pytest-cov==7.1.0",
    "pytest-order==1.5.0",
    "pytest-randomly==5.1.0",
    "pytest-xdist==3.8.0",
    "httpx>=0.28.1",
    "mypy==1.18.2",
    "types-PyYAML==6.0.12.12",
    "types-python-dateutil==2.9.0.20240315",
    "types-requests==2.32.0.20241016",
]

[tool.fastapi]
entrypoint = "main:app"
