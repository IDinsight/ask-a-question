[project]
name = "speech-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.5",
    "fastapi[standard]==0.163.1",
    "ffmpeg-python==0.2.0",
    "gunicorn==27.0.1",
    "litellm==1.109.1",
    "openai>=2.20.0,<4",
    "openai-whisper==20250625",
    "piper-tts==1.8.0",
    "python-multipart==0.0.33",
    "ruff==0.17.5",
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
# Put the project root on sys.path so tests can `import main` / `import app`
# the same way `fastapi dev main.py` and the Docker image (PYTHONPATH) do.
pythonpath = ["."]
# Explicit default required by pytest-asyncio 1.x (silences deprecation warning).
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
# openai-whisper ships no type hints or py.typed marker; treat it as Any.
module = ["whisper", "whisper.*"]
ignore_missing_imports = true
